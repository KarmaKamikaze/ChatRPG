---
name: Build

on:
  pull_request:
    branches: [master, dev]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install dependencies
        run: dotnet restore
        working-directory: ChatRPG/
      - name: Build
        run: dotnet build --configuration Release --no-restore
        working-directory: ChatRPG/
